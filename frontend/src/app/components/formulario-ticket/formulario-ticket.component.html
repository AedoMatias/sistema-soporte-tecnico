
<section class="formulario">
  <h2>{{ ticketEditar ? 'Editar ticket' : 'Registrar ticket de soporte' }}</h2>

  <form (ngSubmit)="registrarTicket()">

    <div class="campo">
      <label for="asunto">Asunto</label>
      <input
        type="text"
        id="asunto"
        name="asunto"
        [(ngModel)]="asunto"
        required
      />
    </div>

    <div class="campo">
      <label for="solicitante">Solicitante</label>
      <input
        type="text"
        id="solicitante"
        name="solicitante"
        [(ngModel)]="solicitante"
        required
      />
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        name="descripcion"
        [(ngModel)]="descripcion"
        required
      ></textarea>
    </div>

    <div class="campo">
      <label for="categoria">Categoría</label>
      <select
        id="categoria"
        name="categoria"
        [(ngModel)]="categoria"
        required
      >
        <option value="">Selecciona una categoría</option>
        <option value="Hardware">Hardware</option>
        <option value="Software">Software</option>
        <option value="Redes">Redes</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="campo">
      <label for="prioridad">Prioridad</label>
      <select
        id="prioridad"
        name="prioridad"
        [(ngModel)]="prioridad"
        required
      >
        <option value="">Selecciona una prioridad</option>
        <option value="Alta">Alta</option>
        <option value="Media">Media</option>
        <option value="Baja">Baja</option>
      </select>
    </div>

    <div class="campo" *ngIf="ticketEditar">
      <label for="estado">Estado</label>
      <select
        id="estado"
        name="estado"
        [(ngModel)]="estado"
      >
        <option value="Pendiente">Pendiente</option>
        <option value="En proceso">En proceso</option>
        <option value="Finalizado">Finalizado</option>
      </select>
    </div>

    <p *ngIf="mensaje" class="mensaje-error">
      {{ mensaje }}
    </p>

    <button type="submit">
      {{ ticketEditar ? 'Guardar cambios' : 'Registrar ticket' }}
    </button>

    <button
      *ngIf="ticketEditar"
      type="button"
      (click)="cancelarEdicion()"
    >
      Cancelar
    </button>

  </form>
</section>
